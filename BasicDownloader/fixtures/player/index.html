<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Stream Downloader Fixtures</title><style>body{font:16px system-ui;max-width:900px;margin:auto}video{width:640px;background:#111}button,code{display:block;margin:8px}</style><script src="vendor/hls.min.js"></script><script src="vendor/dash.all.min.js"></script></head><body><h1>로컬 미디어 fixture</h1><h2>Direct MP4</h2><video id="direct" controls src="../generated/direct.mp4"></video><h2>HLS</h2><video id="hls" controls></video><button onclick="playHls('../generated/stream.m3u8')">MPEG-TS HLS 재생</button><button onclick="playHls('../generated/fmp4.m3u8')">fMP4 HLS 재생</button><button onclick="playHls('../generated/separate-av.m3u8')">분리 A/V HLS 재생</button><button onclick="playHls('../generated/live.m3u8')">live-style HLS 재생</button><button onclick="playHls('../slow/stream.m3u8')">slow HLS 재생 (수명주기 시험)</button><h2>DASH</h2><video id="dash" controls></video><button onclick="playDash('../generated/stream.mpd')">DASH 재생</button><button onclick="playDash('../generated/separate-av.mpd')">분리 A/V DASH 재생</button><h2>인증</h2><button onclick="fetch('../auth/set-cookie').then(()=>location.reload())">fixture Cookie 설정</button><code><a href="../auth/referer.m3u8">Referer manifest</a></code><code><a href="../auth/cookie.m3u8">Cookie manifest</a></code><code><a href="../auth/signed.m3u8?token=valid-fixture-token">유효 signed manifest</a></code><code><a href="../auth/signed.m3u8?token=expired-fixture-token">만료 signed manifest</a></code><script>let dashPlayer;function playHls(url){const video=document.querySelector('#hls');if(Hls.isSupported()){const player=new Hls();player.loadSource(url);player.attachMedia(video);player.on(Hls.Events.MANIFEST_PARSED,()=>video.play());}else{video.src=url;video.play();}}function playDash(url){dashPlayer?.reset();dashPlayer=dashjs.MediaPlayer().create();dashPlayer.initialize(document.querySelector('#dash'),url,true);}</script></body></html>
