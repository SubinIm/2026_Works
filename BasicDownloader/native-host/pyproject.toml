[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "personal-stream-downloader-host"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]
[project.scripts]
stream-host = "stream_host.__main__:main"
[tool.setuptools]
package-dir = {"" = "src"}
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

