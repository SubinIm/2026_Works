<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Paperdesk에 저장</title><link rel="stylesheet" href="style.css"></head><body class="popup"><header><span class="brand">P<span class="brand-dot">.</span></span><div><strong>Paperdesk</strong><small>논문과 기술문서를 한곳에</small></div></header><form id="capture"><label>제목<input name="title" required></label><label>저자 <small>여러 명은 세미콜론으로 구분</small><input name="authors"></label><div class="row"><label>분류<select name="kind"><option value="paper">논문</option><option value="document">기술문서</option></select></label><label>발행일<input name="date" placeholder="2026-10-05"></label></div><label>컬렉션<input name="collection" placeholder="예: 배터리 모델링"></label><label>태그<input name="tags" placeholder="예: MATLAB, review"></label><button id="save" type="submit" disabled>라이브러리에 저장</button></form><p id="message" role="status">현재 페이지를 읽고 있습니다…</p><button id="library" class="secondary">라이브러리 열기 ↗</button><script type="module" src="popup.js"></script></body></html>
