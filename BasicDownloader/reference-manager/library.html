<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Paperdesk · 내 라이브러리</title><link rel="stylesheet" href="style.css"></head><body>
<div class="layout"><aside><header><span class="brand">P<span class="brand-dot">.</span></span><div><strong>Paperdesk</strong><small>나의 연구 라이브러리</small></div></header><p class="eyebrow">WORKSPACE</p><button id="all" class="nav">▤ &nbsp; 모든 자료</button><p class="eyebrow">COLLECTIONS</p><div id="collections"></div><div class="local-note"><span class="dot"></span> 내 PC에 저장됨<p>PDF와 메모는 이 브라우저에 보관됩니다. 정기적으로 백업해주세요.</p></div></aside>
<main><div class="topline"><span>LIBRARY / PERSONAL</span><span>LOCAL FIRST</span></div><section class="heading"><div><p class="eyebrow">YOUR KNOWLEDGE, CONNECTED</p><h1>내 라이브러리<span class="brand-dot">.</span></h1><p>읽고, 기록하고, 다시 발견하세요.</p></div><button id="new">＋ 자료 추가</button></section>
<div class="stats"><div><span>저장한 자료</span><strong id="total">0</strong></div><div><span>읽는 중</span><strong id="reading">0</strong></div><div><span>읽기 완료</span><strong id="done">0</strong></div></div>
<div class="toolbar"><input id="search" type="search" aria-label="자료 검색" placeholder="제목, 저자, DOI, 태그, 메모 검색…"><select id="status" aria-label="읽기 상태"><option value="">모든 읽기 상태</option value="unread">읽기 전</option><option value="reading">읽는 중</option><option value="done">완료</option></select><select id="kind" aria-label="자료 종류"><option value="">모든 종류</option><option value="paper">논문</option><option value="document">기술문서</option></select></div>
<div class="list-heading"><span id="count">전체 자료</span><span>최근 저장순</span></div><div id="records"></div><p id="message" role="status" aria-live="polite"></p>
<footer><button id="backup" class="secondary">전체 백업 (PDF 포함)</button><button id="restore" class="secondary">백업 가져오기</button><button id="bibtex" class="secondary">검색 결과 BibTeX</button><input id="backup-file" type="file" accept="application/json,.json" hidden></footer></main></div>
<dialog id="editor"><form id="edit"><div class="dialog-heading"><h2 id="editor-title">자료 추가</h2><button id="close" type="button" class="secondary">닫기</button></div><label>제목<input name="title" required></label><div class="row"><label>종류<select name="kind"><option value="paper">논문</option><option value="document">기술문서</option></select></label><label>읽기 상태<select name="status"><option value="unread">읽기 전</option><option value="reading">읽는 중</option><option value="done">완료</option></select></label></div><label>저자 (세미콜론으로 구분)<input name="authors"></label><div class="row"><label>발행일<input name="date"></label><label>DOI<input name="doi"></label></div><label>원문 URL<input name="url" type="url" pattern="https?://.*"></label><label>PDF URL<input name="pdfUrl" type="url" pattern="https?://.*"></label><div class="row"><label>컬렉션<input name="collection" placeholder="프로젝트 또는 주제"></label><label>태그<input name="tags" placeholder="쉼표로 구분"></label></div><div class="row"><label>제품·문서 버전<input name="version"></label><label>열람일<input name="accessed" type="date"></label></div><label>메모<textarea name="notes" rows="5" placeholder="핵심 내용, 질문, 다음에 살펴볼 내용…"></textarea></label><label>PDF 첨부 (최대 50 MB)<input id="pdf" type="file" accept=".pdf,application/pdf"></label><p id="attachment-info"></p><label class="check"><input id="detach" type="checkbox"> 기존 첨부 제거</label><p id="edit-message" role="alert"></p><div class="dialog-actions"><button id="delete" type="button" class="danger">자료 삭제</button><button id="submit" type="submit">저장</button></div></form></dialog><script type="module" src="library.js"></script></body></html>
