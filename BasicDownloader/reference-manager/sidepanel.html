<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Paperdesk 사이드바</title><link rel="icon" type="image/png" href="icons/icon-32.png"><link rel="stylesheet" href="style.css"></head><body class="popup sidebar"><header><img class="brand-icon" src="icons/icon-48.png" width="40" height="40" alt=""><div><strong>Paperdesk</strong><small>논문과 기술문서를 한곳에</small></div></header><p id="source-status" class="metadata" role="status"></p><div class="capture-tools"><button id="reload-page" type="button" class="secondary">현재 탭 불러오기</button><button id="open-sidebar" type="button" class="secondary">사이드바로 이어서 작업</button></div><form id="capture"><label>제목<input name="title" required></label><label>저자·발명자 <small>여러 명은 세미콜론으로 구분</small><input name="authors"></label><div class="row"><label>분류<select name="kind"><option value="paper">논문</option><option value="document">기술문서</option></select></label><label>발행일<input name="date" placeholder="2026-10-05"></label></div><label>저널·학술대회명<input name="venue"></label><label>DOI<input name="doi"><a id="doi-link" hidden target="_blank" rel="noopener noreferrer">DOI 원문 ↗</a></label><label>원문 URL<input name="url" type="url" pattern="https?://.*"></label><label>PDF URL<input name="pdfUrl" type="url" pattern="https?://.*"></label><label>컬렉션<input name="collection" placeholder="예: 배터리 모델링"></label><label>태그<input name="tags" placeholder="예: MATLAB, review"></label><label id="exclude-label" class="check" hidden><input id="exclude-capture" type="checkbox"><span>이 자료 서지 찾기에서 제외 (즉시 저장)</span></label><div id="capture-candidates" aria-live="polite"></div><button id="read-metadata" type="button" class="secondary" disabled>문서 서지정보 읽기</button><button id="save" type="submit" disabled>라이브러리에 저장</button></form><p id="message" role="status">현재 페이지를 읽고 있습니다…</p><button id="library" class="secondary">라이브러리 열기 ↗</button><button id="auto-library" class="secondary">열린 탭 자동 정리 ↗</button><script type="module" src="popup.js"></script></body></html>
